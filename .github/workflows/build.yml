name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build board matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          boards = []
          for path in sorted(glob.glob('configs/boards/*.conf')):
              conf = {}
              with open(path, encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith('#') or '=' not in line:
                          continue
                      key, value = line.split('=', 1)
                      conf[key.strip()] = value.strip().strip('"')
              if conf.get('ENABLED', 'false').lower() != 'true':
                  continue
              boards.append({
                  'board': conf['BOARD_ID'],
                  'name': conf['BOARD_NAME'],
                  'dsc': conf['DSC'],
                  'dtb': conf['DTB_NAME'],
              })
          print('matrix=' + json.dumps({'include': boards}, separators=(',', ':')))
          PY
          cat "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu nasm acpica-tools uuid-dev \
            python3 device-tree-compiler mtools dosfstools xz-utils ca-certificates

      - name: Cache edk2 BaseTools
        uses: actions/cache@v4
        with:
          path: edk2/BaseTools/Source/C/bin
          key: basetools-${{ runner.os }}-edk2-stable202608-${{ hashFiles('scripts/ci/setup.sh') }}

      - name: Prepare edk2
        run: scripts/ci/setup.sh

      - name: Build ${{ matrix.name }}
        run: |
          source "configs/boards/${{ matrix.board }}.conf"
          export PACKAGES_PATH="$PWD:$PWD/edk2"
          export GCC_AARCH64_PREFIX=aarch64-linux-gnu-
          export WORKSPACE="$PWD"
          export PYTHON_COMMAND=python3
          source edk2/edksetup.sh BaseTools >/dev/null
          build -a AARCH64 -t GCC -b DEBUG -n "$(nproc)" -p "${DSC}" \
            2>&1 | tee "build-${BOARD_ID}.log"

      - name: Generate DTB
        run: scripts/gen-dtb.sh "${{ matrix.board }}" "out/${{ matrix.board }}"

      - name: Safety guards (fuses untouched, FV writable)
        run: |
          scripts/ci/check-no-fuse-lock.sh
          python3 scripts/ci/check-fv-locks.py Build/*/DEBUG_GCC/FV/*.Fv

      - name: Package release
        run: |
          source "configs/boards/${{ matrix.board }}.conf"
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA:0:8}"
          fi
          scripts/pack/make-release.sh "${BOARD_ID}" "${VERSION}" "artifacts/${BOARD_ID}"
          cp "build-${BOARD_ID}.log" "artifacts/${BOARD_ID}/"
          ( cd "artifacts/${BOARD_ID}" && rm -f SHA256SUMS && sha256sum * > SHA256SUMS )
          cat "artifacts/${BOARD_ID}/SHA256SUMS"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: artifacts/${{ matrix.board }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "# rk-edk2 ${GITHUB_REF_NAME}"
            echo
            find artifacts -name RELEASE_NOTES.md -exec cat {} \;
          } > /tmp/notes.md

          mapfile -t FILES < <(find artifacts -type f \
            ! -name RELEASE_NOTES.md ! -name SHA256SUMS | sort)
          ( cd artifacts && find . -type f \
              ! -name RELEASE_NOTES.md ! -name SHA256SUMS \
              -exec sha256sum {} \; | \
              awk '{n=split($2,p,"/"); print $1"  "p[n]}' | sort -k2 ) \
            > /tmp/SHA256SUMS
          FILES+=(/tmp/SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "rk-edk2 ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md
