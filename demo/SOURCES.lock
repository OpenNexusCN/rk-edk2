## demo/upstream/rk3399-edk2

GPL-2.0 / BSD-3-Clause 混合，文件头保留原始声明。该快照仅作参考，不参与编译。

## 更新方式

更新任一参考代码时：

1. 从对应仓库导出新版本到本目录；
2. 更新本文件的 commit；
3. 同步更新 `boards/*/hardware.md` 中受影响的硬件描述；
4. 运行 `scripts/gen-dtb.sh` 确认 DTS 仍可编译。
